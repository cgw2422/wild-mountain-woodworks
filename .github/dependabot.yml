version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Security-sensitive stack, reviewed together.
      framework-and-auth:
        patterns: ["next", "react", "react-dom", "better-auth", "@better-auth/*", "prisma", "@prisma/*", "zod"]
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
